<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="badgeShade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1830"/>
      <stop offset="100%" stop-color="#050912"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="2.6" fill="#d4a544" opacity="0.55"/>
    </pattern>
    <clipPath id="badgeClip">
      <circle cx="400" cy="400" r="328"/>
    </clipPath>
  </defs>

  <!-- Outer blue ring -->
  <circle cx="400" cy="400" r="372" fill="none" stroke="#1ea0ff" stroke-width="6"/>

  <!-- Badge background -->
  <g clip-path="url(#badgeClip)">
    <circle cx="400" cy="400" r="328" fill="url(#badgeShade)"/>

    <!-- Dot texture, confined to top-right quadrant -->
    <rect x="430" y="80" width="320" height="380" fill="url(#dotGrid)"/>

    <!-- Soft inner vignette for depth -->
    <circle cx="400" cy="400" r="328" fill="none" stroke="#0a1424" stroke-width="36" opacity="0.32"/>
  </g>

  <!-- NV76: N + 76 in white, V in blue via tspans (proper kerning inherited) -->
  <text x="400" y="478" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="310" letter-spacing="-6">
    <tspan fill="#ffffff">N</tspan>
    <tspan fill="#1ea0ff">V</tspan>
    <tspan fill="#ffffff">76</tspan>
  </text>

  <!-- "— H U B —" subtitle -->
  <g fill="#1ea0ff" font-family="'Arial Black', Arial, sans-serif" font-weight="900">
    <rect x="245" y="525" width="40" height="3" rx="1.5"/>
    <text x="400" y="540" font-size="52" text-anchor="middle" letter-spacing="14">HUB</text>
    <rect x="515" y="525" width="40" height="3" rx="1.5"/>
  </g>

  <!-- Tagline -->
  <text x="400" y="625" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="22"
        fill="#aeb6c4" letter-spacing="6" opacity="0.85">
    CRIATIVIDADE  ·  SERVIÇOS  ·  SOLUÇÕES
  </text>
</svg>
